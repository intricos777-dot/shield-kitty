# Shield Kitty device whitelist
#
# Format:  <VID>:<PID>  # description
# Case-insensitive. Comments and blank lines ignored.
#
# Devices NOT listed here are treated as unknown. An unknown device gets one
# chance: it is logged, you get a notification, and it is quarantined (its
# driver is unbound so it cannot read or write anything). A second attempt by
# the same device is a permanent ban, written to the blacklist.
#
# Built-in always-allowed: root hubs (1d6b:*), and HID-class devices
# (keyboards/mice/gamepads) — see ALLOWED_CLASSES in shield-kitty-devices.py.
# Blocking those risks locking you out of your own machine over a typo here.

